<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farol Runner</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 20px; }
  .card { border: 1px solid #4444; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .ok { background: #34c759; } .bad { background: #ff3b30; } .idle { background: #999; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px;
          border: 1px solid #5555; background: transparent; color: inherit; margin: 6px 0; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 8px; cursor: pointer;
           background: #0a84ff; color: white; font-weight: 600; margin-top: 6px; }
  button.ghost { background: transparent; border: 1px solid #0a84ff; color: #0a84ff; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <h1>Farol Runner</h1>
  <div class="sub">Thin client · Slack ↔ your local agent</div>
  <div id="app-error" style="color:#ff3b30;font-size:12px;white-space:pre-wrap;margin-bottom:12px"></div>

  <div id="status-card" class="card">
    <div class="row"><span>Connection</span>
      <span><span id="conn-dot" class="dot idle"></span><span id="conn-text">—</span></span></div>
    <div class="row"><span>Workspace</span><span id="ws">—</span></div>
    <div class="row"><span>Agents</span><span id="agents">—</span></div>
    <div class="row"><span>Work folder</span><span id="root">—</span></div>
  </div>

  <div id="login-card" class="card" style="display:none">
    <button id="connect-btn" onclick="doConnect()">Connect to Slack</button>
    <div style="font-size:12px;color:#888;margin-top:6px">
      Opens your Farol dashboard in the browser — approve there, and this
      machine starts answering mentions in your Slack.
    </div>
    <div id="connect-status" style="color:#888;font-size:12px;margin-top:6px"></div>
  </div>

  <div class="card">
    <div style="font-size:12px;color:#888;margin-bottom:8px">
      Coding agents — the runner carries none, each arrives on a press.
    </div>
    <div id="agent-list"></div>
    <div id="agent-error" style="color:#ff3b30;font-size:12px;white-space:pre-wrap"></div>
  </div>

  <div class="card">
    <button class="ghost" id="logout-btn" style="display:none" onclick="doLogout()">Disconnect</button>
  </div>

  <div id="version" class="sub" style="text-align:center;margin:16px 0 0"></div>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;

  async function refresh() {
    const s = await invoke('get_status');
    document.getElementById('conn-dot').className = 'dot ' + (s.connected ? 'ok' : 'idle');
    document.getElementById('conn-text').textContent = s.connected ? 'Connected' : 'Offline';
    document.getElementById('ws').textContent = s.workspace_id || '—';
    document.getElementById('agents').textContent = s.agents.join(', ') || '—';
    document.getElementById('version').textContent = 'v' + s.version;
    const root = document.getElementById('root');
    root.textContent = (s.root || '—').replace(/^\/Users\/[^/]+/, '~').replace(/^\/home\/[^/]+/, '~');
    root.title = s.root + '  —  each channel works in its own folder here';
    document.getElementById('login-card').style.display = s.logged_in ? 'none' : 'block';
    document.getElementById('logout-btn').style.display = s.logged_in ? 'block' : 'none';
  }

  async function refreshAgents() {
    const rows = await invoke('list_agents');
    const box = document.getElementById('agent-list');
    box.innerHTML = '';
    for (const a of rows) {
      const row = document.createElement('div');
      row.className = 'row';
      const left = document.createElement('span');
      left.textContent = a.label;
      const right = document.createElement('span');
      if (a.resolved) {
        right.innerHTML = '<span class="dot ok"></span>ready';
        right.title = a.resolved;
      } else {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.textContent = 'Install';
        btn.style.margin = '0';
        btn.style.width = 'auto';
        btn.onclick = () => installAgent(a.name, btn);
        right.appendChild(btn);
      }
      row.append(left, right);
      box.appendChild(row);
    }
  }

  async function installAgent(name, btn) {
    document.getElementById('agent-error').textContent = '';
    btn.disabled = true;
    btn.textContent = 'Installing…';
    try {
      await invoke('install_agent', { name });
      await refreshAgents();
    } catch (e) {
      document.getElementById('agent-error').textContent = String(e && e.message || e);
      btn.disabled = false;
      btn.textContent = 'Install';
    }
  }

  // One place for anything that went wrong. It does not reveal the connect
  // card: an error while connected is still an error, not a logout.
  function showError(e) {
    document.getElementById('app-error').textContent = String(e && e.message || e);
  }
  window.onerror = (m, s, l, c, err) => showError(err || m);
  window.onunhandledrejection = ev => showError(ev.reason);

  function resetConnect() {
    document.getElementById('connect-btn').disabled = false;
    document.getElementById('connect-status').textContent = '';
  }

  async function doConnect() {
    document.getElementById('app-error').textContent = '';
    document.getElementById('connect-btn').disabled = true;
    document.getElementById('connect-status').textContent = 'Waiting for browser approval…';
    try {
      // Returns once the browser is opened; approval continues in the
      // background and resolves via status-changed / cloud-error events.
      await invoke('authorize_in_browser');
    } catch (e) {
      resetConnect();
      showError(e);
    }
  }

  async function doLogout() { await invoke('logout'); refresh(); }

  // An update lands beside the running copy; saying so is the only way a
  // person knows to restart, and the only place the version in the footer
  // stops matching what they will get next time.
  listen('update-installed', e => {
    const v = document.getElementById('version');
    v.textContent = `v${v.textContent.replace(/^v/, '')} — updated to ${e.payload}, restart to apply`;
  });
  listen('status-changed', () => { resetConnect(); refresh(); });
  listen('cloud-error', e => { resetConnect(); showError(e.payload); });
  refresh();
  refreshAgents();
</script>
</body>
</html>
