[package]
name = "opentag-core"
version.workspace = true
edition.workspace = true

[dependencies]
# Speaking ACP, and knowing which agents do, is shared with the other products
# that run a local agent the same way. Pinned by tag: three repositories with
# three release rhythms must not break on each other.
acp-client = { git = "https://github.com/farol-team/acp-agents", tag = "v0.1.1" }
acp-agents = { git = "https://github.com/farol-team/acp-agents", tag = "v0.1.1" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tracing-subscriber.workspace = true
