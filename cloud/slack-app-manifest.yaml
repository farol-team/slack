# Slack App Manifest for Farol Cloud (dev).
# Import: https://api.slack.com/apps → Create New App → From a manifest → paste this YAML.
# IMPORTANT: once the tunnel is up (step 3), replace request_url with
#   https://<your-ngrok-host>/slack/events
display_information:
  name: farol-dev-bot
  description: Farol (dev)
features:
  bot_user:
    display_name: farol-dev-bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:read
      - channels:history
      - channels:join
      - chat:write
      - files:read
      - groups:read
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read
      - users:read.email
settings:
  # Approve/Deny/Stop are buttons: without this, Slack delivers the click
  # nowhere and the agent waits for an answer that cannot arrive. Bolt takes
  # interactions on the same endpoint as events.
  interactivity:
    is_enabled: true
    request_url: https://REPLACE-ME.ngrok.io/slack/events
  event_subscriptions:
    request_url: https://REPLACE-ME.ngrok.io/slack/events
    bot_events:
      - app_mention
      - message.im       # a DM to the bot is a task, no mention needed
      - message.channels
      - message.groups   # приватные каналы тоже пишем в память (OV channel = id канала)
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
