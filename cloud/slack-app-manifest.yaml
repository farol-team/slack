# Slack App Manifest for OpenTag Cloud (dev).
# Import: https://api.slack.com/apps → Create New App → From a manifest → paste this YAML.
# IMPORTANT: once the tunnel is up (step 3), replace request_url with
#   https://<your-ngrok-host>/slack/events
display_information:
  name: opentag-dev-bot
  description: OpenTag (dev)
features:
  bot_user:
    display_name: opentag-dev-bot
    always_online: true
oauth_config:
  # A manifest replaces the whole config: without these two the dashboard
  # cannot sign anyone in and the install callback has nowhere to land.
  redirect_urls:
    - https://REPLACE-ME.ngrok.io/api/oauth/callback
    - https://REPLACE-ME.ngrok.io/api/slack/callback
  scopes:
    # "Sign in with Slack" (OIDC) — the dashboard login.
    user:
      - openid
      - profile
      - email
    bot:
      - app_mentions:read
      - channels:read
      - channels:history
      - channels:join
      - chat:write
      - files:read
      - groups:read
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read
      - users:read.email
settings:
  # Approve/Deny/Stop are buttons: without this, Slack delivers the click
  # nowhere and the agent waits for an answer that cannot arrive. Bolt takes
  # interactions on the same endpoint as events.
  interactivity:
    is_enabled: true
    request_url: https://REPLACE-ME.ngrok.io/slack/events
  event_subscriptions:
    request_url: https://REPLACE-ME.ngrok.io/slack/events
    bot_events:
      - app_mention
      - message.im       # a DM to the bot is a task, no mention needed
      - file_deleted     # deleting in Slack removes the copy in memory
      - message.channels
      - message.groups   # private channels are archived too (OV channel = channel id)
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
