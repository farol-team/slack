# Slack App Manifest for OpenTag — production (app id A0BP0QCBCMN).
#
# Events go DIRECTLY to the cloud VM (hooks.opentag.farol.team, caddy TLS): the
# Yandex API Gateway strips Slack signature headers, so events cannot
# pass through opentag.farol.team. OAuth redirects are browser redirects
# (query params) and stay on the SaaS domain.
#
# Applying this REPLACES the whole app configuration — anything set by hand in
# api.slack.com and missing here is removed. Keep `oauth_config.scopes.bot` in
# lockstep with `SLACK_SCOPES` in app/api/slack-oauth.ts (a test enforces it),
# and remember that widening scopes does not reach installed workspaces: Slack
# grants scopes at install time, so each workspace must reinstall.
display_information:
  name: OpenTag
  description: Slack ↔ your local AI agents, with team memory
  background_color: "#590088"
  long_description: >-
    Memory for Slack. Bring your own agents. Mention the bot in any thread —
    a coding agent on your own machine picks up the task, remembers everything
    your team ever said, and streams the answer back.
features:
  bot_user:
    display_name: opentag
    always_online: true
oauth_config:
  redirect_urls:
    - https://opentag.farol.team/api/slack/callback
    - https://opentag.farol.team/api/oauth/callback
  scopes:
    user:
      # Sign-in only. The agent never acts as a human and never reads with
      # a human's eyes: memory is scoped to the channel that asked, so a
      # person-scoped grant would have nothing to attach to but risk.
      - openid
      - profile
      - email
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - bookmarks:write
      - canvases:read
      - canvases:write
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - chat:write.customize
      - commands
      - emoji:read
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - pins:read
      - pins:write
      - reactions:read
      - reactions:write
      - search:read.public
      - team:read
      - usergroups:read
      - users.profile:read
      - users:read
      - users:read.email
settings:
  # Approve/Deny/Stop are buttons: without this, Slack delivers the click
  # nowhere and the agent waits for an answer that cannot arrive. Bolt takes
  # interactions on the same endpoint as events.
  interactivity:
    is_enabled: true
    request_url: https://hooks.opentag.farol.team/slack/events
  event_subscriptions:
    request_url: https://hooks.opentag.farol.team/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups    # private channels are archived too
      - message.im
      - message.mpim      # a group DM is a conversation, not an archive
      - file_deleted      # deleting in Slack removes the copy in memory
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
