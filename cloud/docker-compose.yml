version: "3.9"

services:
  openviking:
    # Official image moved to GitHub Container Registry. `/app/.openviking`
    # holds the config (ov.conf, ovcli.conf) — but NOT the memory itself:
    # the workspace defaults to `/app/data` (`storage.workspace` in ov.conf),
    # so without the second volume every account, resource and vector lives
    # in the container's writable layer and dies with `compose up --build`.
    image: ghcr.io/volcengine/openviking:latest
    ports:
      - "1934:1933"   # host port 1933 is taken by workroom-openviking-1; inside the compose network the service is still openviking:1933
    volumes:
      - ov-data:/app/.openviking
      - ov-store:/app/data
    environment:
      # VLM + embeddings are mandatory for L0/L1 processing.
      # Configure via `openviking-server init` or mount an ov.conf.
      OPENVIKING_CONFIG: /app/.openviking/ov.conf

  cloud:
    build: .
    ports:
      - "8000:8000"
    environment:
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      OPENTAG_SAAS_URL: ${OPENTAG_SAAS_URL}
      OPENTAG_CLOUD_PUBLIC_URL: ${OPENTAG_CLOUD_PUBLIC_URL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      OPENVIKING_URL: http://openviking:1933
      OPENVIKING_ROOT_KEY: ${OPENVIKING_ROOT_KEY}
    depends_on:
      - openviking

volumes:
  ov-data:
  ov-store:
