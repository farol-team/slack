# Builds the Farol Runner for macOS on runner-v* tags: the desktop app as a
# signed, notarized .dmg, plus the headless binaries for servers and CI.
# Linux is parked — see the build matrix.
#
# The tag carries the version (runner-vX.Y.Z), and the app updates itself from
# the `latest.json` published here — so a release tag must never be reused.
#
# Optional repository secrets — when APPLE_CERTIFICATE is absent the macOS
# builds still succeed, just unsigned:
#   APPLE_CERTIFICATE           base64 .p12 Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_ID / APPLE_PASSWORD   Apple ID + app-specific password (notarization)
#   APPLE_TEAM_ID               Developer Team ID
name: runner-release

on:
  push:
    tags: ["runner-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: farol-runner-darwin-arm64
          # x64 cross-compiles on the arm64 runner (one Apple SDK covers both);
          # macos-13 Intel runners have hour-long queues on the free tier.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: farol-runner-darwin-x64
          # Linux is parked while the macOS app is being debugged — put the
          # ubuntu-22.04 / x86_64-unknown-linux-gnu entry back to ship it again.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner
    env:
      # Step-level `if` can't read the secrets context — mirror it into env.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
      - name: Build
        run: cargo build --release -p farol-core --example headless --target ${{ matrix.target }}
      - name: Stage asset
        run: cp target/${{ matrix.target }}/release/examples/headless ${{ matrix.asset }}
      - name: Import signing certificate
        if: ${{ runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p ci $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          # Keep the keychain on the search list and unlocked: a locked keychain
          # makes codesign block forever on a GUI prompt that never appears here.
          security list-keychains -d user -s $KEYCHAIN login.keychain
          security unlock-keychain -p ci $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci $KEYCHAIN
          rm cert.p12
      - name: Sign and notarize
        if: ${{ runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "Signing with: $IDENTITY"
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" ${{ matrix.asset }}
          codesign --verify --strict --verbose=2 ${{ matrix.asset }}
          # notarytool only accepts containers — a bare Mach-O goes in a zip.
          # A CLI binary cannot be stapled (stapler needs .app/.dmg/.pkg);
          # Gatekeeper resolves the ticket online on first run instead.
          ditto -c -k --keepParent ${{ matrix.asset }} notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          rm notarize.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: runner/${{ matrix.asset }}
          if-no-files-found: error

  # The desktop app is what a macOS user actually wants from the dashboard:
  # a .dmg they drag to Applications, not a bare CLI binary.
  desktop-macos:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: runner/apps/desktop
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
      - name: Import signing certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p ci $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN login.keychain
          security unlock-keychain -p ci $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci $KEYCHAIN
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
      # The tag is the version. Retagging the same one is fine for a manual
      # download and fatal for an updater: it compares versions, so a build
      # that says 0.1.0 forever can never replace itself.
      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#runner-v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not runner-vX.Y.Z"; exit 1 ;;
          esac
          echo "APP_VERSION=$version" >> $GITHUB_ENV
          python3 - "$version" <<'PY'
          import json, sys, pathlib
          v = sys.argv[1]
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          d = json.loads(conf.read_text()); d["version"] = v
          conf.write_text(json.dumps(d, indent=2) + "\n")
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          lines = cargo.read_text().split("\n")
          for i, line in enumerate(lines):
              if line.startswith("version = "):
                  lines[i] = f'version = "{v}"'
                  break
          cargo.write_text("\n".join(lines))
          print("building version", v)
          PY

      - name: Build .dmg (universal)
        env:
          # Shown in the app footer: the tag gets moved, the commit does not.
          FAROL_BUILD_SHA: ${{ github.sha }}
          # Signs the updater artifact; without it the bundler emits none and
          # the feed below would advertise something no app would accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm install
          # The repo ships a single 1024px source icon; the bundler needs the
          # generated .icns/.ico set next to it.
          npx tauri icon src-tauri/icons/icon.png
          npx tauri build --target universal-apple-darwin
      - name: Notarize and staple the .dmg
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri notarizes and staples the .app, but ships the .dmg container
          # only signed — Gatekeeper checks the .dmg the user double-clicks.
          # Bundles land in the Cargo workspace target dir, not under src-tauri.
          dmg=$(ls "$GITHUB_WORKSPACE"/runner/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          [ -n "$dmg" ] || { echo "no .dmg produced"; exit 1; }
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
      - name: Stage assets and the update feed
        run: |
          bundle="$GITHUB_WORKSPACE/runner/target/universal-apple-darwin/release/bundle"
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)
          [ -n "$dmg" ] || { echo "no .dmg produced"; exit 1; }
          # Stable names so releases/latest/download/... keeps working.
          cp "$dmg" farol-runner-macos.dmg

          # The updater takes the tarball, not the disk image, and refuses one
          # whose signature it cannot verify — so both ship or neither does.
          tar=$(ls "$bundle"/macos/*.app.tar.gz | head -1)
          sig=$(ls "$bundle"/macos/*.app.tar.gz.sig | head -1)
          [ -n "$tar" ] && [ -n "$sig" ] || { echo "no updater artifact"; exit 1; }
          cp "$tar" farol-runner-macos.app.tar.gz

          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/farol-runner-macos.app.tar.gz"
          python3 - "$APP_VERSION" "$(cat "$sig")" "$url" > latest.json <<'PY'
          import json, sys, datetime
          version, signature, url = sys.argv[1], sys.argv[2], sys.argv[3]
          # One universal build serves both architectures; the feed still has
          # to name them, because the app looks itself up by platform key.
          platform = {"signature": signature, "url": url}
          print(json.dumps({
              "version": version,
              "notes": "Farol Runner " + version,
              "pub_date": datetime.datetime.now(datetime.UTC)
                  .isoformat(timespec="seconds").replace("+00:00", "Z"),
              "platforms": {
                  "darwin-aarch64": platform,
                  "darwin-x86_64": platform,
              },
          }, indent=2))
          PY
          cat latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: farol-runner-macos
          path: |
            runner/apps/desktop/farol-runner-macos.dmg
            runner/apps/desktop/farol-runner-macos.app.tar.gz
            runner/apps/desktop/latest.json
          if-no-files-found: error

  release:
    needs: [build, desktop-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Farol Runner ${{ github.ref_name }}
          files: dist/*
          body: |
            **macOS** — download `farol-runner-macos.dmg`, drag Farol Runner to
            Applications and launch it. Signed and notarized, so it opens
            without Gatekeeper warnings. Installed copies update themselves
            from `latest.json` in this release and apply it on the next launch.

            **Headless binaries** (servers, CI) — macOS arm64 and x64 for now;
            `chmod +x` and run, and it prints a URL that authorizes the runner
            in the browser.
