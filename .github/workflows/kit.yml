# The workflow kit under .claude/ is the revision it says it is.
# See farol-team/agent-flow README ("Canonical source & staying in sync").
name: kit

on:
  pull_request:
  push:
    branches: [master]

jobs:
  kit-intact:
    name: kit intact
    runs-on: ubuntu-latest
    # The check itself takes under a second; the whole job is checkout plus
    # two script runs. Anything past this is the runner not showing up, and
    # a job that waits fifteen minutes and then reports "failure" with no
    # logs reads as a broken check rather than an absent machine.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: bin/kit-verify
      - name: Selftest
        # A green check that cannot go red says nothing. This proves it can on
        # every run, rather than on the day somebody thinks to try it.
        run: bin/kit-verify --selftest
